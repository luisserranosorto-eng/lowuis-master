const key=new URLSearchParams(location.search).get('proyecto');const project=projects[key]||projects.apple;document.body.classList.toggle('full-width-project',!!project.fullWidth);document.body.classList.toggle('siza-project',project.layout==='siza');document.body.classList.toggle('apple-project',project.layout==='apple');document.title=project.title+' — Lowuis';document.querySelector('#title').textContent=project.title;document.querySelector('#category').textContent=project.category;const context=document.querySelector('#projectContext');if(project.context){context.textContent=project.context;context.hidden=false;}function createMedia([type,src],options={}){let el;if(type==='video'){const isHeroVideo=src===project.heroVideo&&!options.silent;const startsWithSound=isHeroVideo&&project.playWithSound;el=document.createElement('video');if(isHeroVideo)el.src=src;else el.dataset.lazySrc=src;if(isHeroVideo&&project.heroPoster)el.poster=project.heroPoster;el.autoplay=isHeroVideo;el.muted=options.silent||!startsWithSound;el.defaultMuted=options.silent||!startsWithSound;el.loop=!isHeroVideo;el.playsInline=true;el.preload=isHeroVideo?'metadata':'none';el.controls=isHeroVideo||options.controls||project.layout==='apple';el.volume=1;el.setAttribute('aria-label','Video del proyecto '+project.title);if(isHeroVideo)el.play().catch(()=>{if(startsWithSound){el.muted=true;el.play().catch(()=>{});}});}else{el=document.createElement('img');el.src=src;el.alt='Pieza del proyecto '+project.title;el.loading='lazy';el.decoding='async';}return el;}const coverMedia=project.heroVideo?['video',project.heroVideo]:project.media[0];const remainingMedia=project.heroVideo?project.media.filter(item=>item[1]!==project.heroVideo):project.media.slice(1);const coverElement=createMedia(coverMedia);if(project.coverPosition)coverElement.style.objectPosition=project.coverPosition;document.querySelector('#cover').appendChild(coverElement);const gallery=document.querySelector('#gallery'),secondaryCover=document. <script>
document.querySelectorAll('#finalPiece video').forEach(video=>{video.controls=true;});
if(project.layout==='apple'){
  gallery.innerHTML='';
  const portraits=document.createElement('div');
  portraits.className='apple-portraits';
  remainingMedia.forEach(item=>{
    const piece=document.createElement('figure');
    piece.className='piece';
    piece.appendChild(createMedia(item));
    if(item[2]==='portrait')portraits.appendChild(piece);else gallery.appendChild(piece);
  });
  gallery.appendChild(portraits);
  const syncFinalVideo=()=>{const firstPiece=portraits.querySelector('.piece');if(firstPiece){finalPiece.style.width=firstPiece.getBoundingClientRect().width+'px';finalPiece.style.padding='0';finalPiece.style.margin='48px auto 0';}};
  syncFinalVideo();
  new ResizeObserver(syncFinalVideo).observe(portraits);
}
if(project.layout==='marty'){
  document.body.classList.add('marty-project');
  [...gallery.children].forEach((piece,index)=>{if(remainingMedia[index]?.[2]==='wide')piece.classList.add('wide');});
}
if(project.layout==='mala'||project.layout==='gala'){
  document.body.classList.add(project.layout+'-project');
  gallery.innerHTML='';
  const groups={};
  const addPiece=(parent,item)=>{const piece=document.createElement('figure');piece.className='piece';piece.appendChild(createMedia(item));parent.appendChild(piece);};
  remainingMedia.forEach(item=>{
    const type=item[2]||'wide';
    if(type==='wide'){addPiece(gallery,item);return;}
    if(!groups[type]){const group=document.createElement('div');group.className='media-group '+type;groups[type]=group;gallery.appendChild(group);}
    addPiece(groups[type],item);
  });
}
  // GitHub Pages distingue los acentos del nombre de archivo; normalizamos las rutas de recursos.
  (function(){
    function fix(media){
      var raw=media.getAttribute&&media.getAttribute('src');
      if(!raw||raw.indexOf('assets/')===-1)return;
      var normalized;
      try{normalized=decodeURIComponent(raw).normalize('NFC');}catch(error){return;}
      if(normalized==='assets/prozine/PROZINE_Página_1.jpg')normalized='assets/prozine/Asset 1Baymax3.jpg';
      if(normalized!==raw)media.setAttribute('src',normalized);
    }
    function scan(node){
      if(node.nodeType!==1)return;
      if(node.matches&&node.matches('img[src],video[src],source[src]'))fix(node);
      if(node.querySelectorAll)node.querySelectorAll('img[src],video[src],source[src]').forEach(fix);
    }
    scan(document.documentElement);
    new MutationObserver(function(records){records.forEach(function(record){
      if(record.type==='attributes')fix(record.target);
      else record.addedNodes.forEach(scan);
    });}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});
  })();
</script>
<script>
  // Los videos secundarios se descargan solo al acercarse a la pantalla.
  (function(){
    const videos=document.querySelectorAll('video[data-lazy-src]');
    const load=video=>{if(video.src)return;video.src=video.dataset.lazySrc;video.autoplay=true;video.load();video.play().catch(()=>{});};
    if(!('IntersectionObserver' in window)){videos.forEach(load);return;}
    const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{
      if(!entry.isIntersecting)return;
      load(entry.target);observer.unobserve(entry.target);
    }),{rootMargin:'500px 0px'});
    videos.forEach(video=>observer.observe(video));
  })();
</script>
